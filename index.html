    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    
    <!-- Bootstrap 5 CSS RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- HLS.js لتشغيل تدفقات الفيديو -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
   <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شريط التنقل العلوي -->
    <nav class="navbar navbar-dark bg-dark border-bottom border-secondary py-3">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-3" href="index.html">
                <img src="IPTV.png" alt="Logo" id="app-logo">
                <span class="fs-4 fw-bold text-white">IPTV Streamer Pro</span>
            </a>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-info btn-sm px-3" id="install-pwa-btn" style="display: none;">
                    <i class="fa-solid fa-download me-1"></i> تثبيت التطبيق
                </button>
                <button class="btn btn-outline-light btn-sm px-3" id="share-btn">
                    <i class="fa-solid fa-share-nodes me-2"></i> مشاركة
                </button>
            </div>
        </div>
    </nav>

    <!-- المحتوى الرئيسي -->
    <div class="container-fluid px-4 py-4 my-auto">
        
        <!-- إدارة القوائم المتعددة وإدخال الرابط أو رفع الملف -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card card-custom p-3 shadow-sm">
                    <!-- تبويبات طرق الإدخال (الرابط أو رفع ملف) -->
                    <ul class="nav nav-tabs nav-pills mb-3 border-secondary" id="playlist-tabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active btn-sm text-white" id="tab-url-mode" data-bs-toggle="pill" data-bs-target="#pane-url" type="button" role="tab">رابط IPTV والقوائم المحفوظة</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link btn-sm text-white" id="tab-file-mode" data-bs-toggle="pill" data-bs-target="#pane-file" type="button" role="tab">رفع ملف M3U من الجهاز</button>
                        </li>
                    </ul>
                    
                    <div class="tab-content" id="playlist-tabsContent">
                        <!-- تفعيل عبر الرابط والقوائم المحفوظة -->
                        <div class="tab-pane fade show active" id="pane-url" role="tabpanel">
                            <div class="row g-3 align-items-end">
                                <div class="col-md-4">
                                    <label class="form-label text-white small fw-bold">القوائم المحفوظة:</label>
                                    <select id="saved-playlists-select" class="form-select form-select-sm">
                                        <option value="">-- اختر قائمة محفوظة --</option>
                                    </select>
                                </div>
                                <div class="col-md-7">
                                    <label class="form-label text-white small fw-bold">أو أدخل رابط M3U جديد:</label>
                                    <div class="input-group">
                                        <input type="url" id="playlist-url" class="form-control" placeholder="https://example.com/playlist.m3u">
                                        <button class="btn btn-primary px-4 fw-bold text-white" type="button" id="load-playlist-btn">
                                            <i class="fa-solid fa-play me-2"></i> تشغيل وحفظ
                                        </button>
                                    </div>
                                </div>
                                <div class="col-md-1">
                                    <button class="btn btn-danger btn-sm w-100" id="delete-playlist-btn" title="حذف القائمة الحالية">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- تفعيل عبر رفع الملف محلياً -->
                        <div class="tab-pane fade" id="pane-file" role="tabpanel">
                            <div class="row g-3 align-items-end">
                                <div class="col-md-10">
                                    <label class="form-label text-white small fw-bold">اختر ملف M3U أو M3U8 من جهازك:</label>
                                    <input type="file" id="playlist-file" class="form-control" accept=".m3u,.m3u8">
                                </div>
                                <div class="col-md-2">
                                    <button class="btn btn-success fw-bold text-white w-100" type="button" id="load-file-btn">
                                        <i class="fa-solid fa-upload me-2"></i> تشغيل الملف
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- منطقة العرض الرئيسية -->
        <div class="row g-4">
            <!-- المشغل وأدواته -->
            <div class="col-lg-8">
                <div class="card card-custom p-3 h-100 shadow-sm">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mb-0 text-white"><i class="fa-solid fa-tv me-2 text-info"></i> المشغل المباشر</h5>
                        <div class="d-flex gap-2">
                            <select id="aspect-ratio-select" class="form-select form-select-sm py-0 px-2" style="font-size: 0.85rem;">
                                <option value="contain">أبعاد طبيعية (Contain)</option>
                                <option value="fill">ملء الشاشة (Fill)</option>
                                <option value="cover">تكبير وتغطية (Cover)</option>
                            </select>
                            <button class="btn btn-outline-light btn-sm py-0 px-2" id="pip-btn" title="صورة داخل صورة (PiP)">
                                <i class="fa-solid fa-clone"></i>
                            </button>
                        </div>
                    </div>
                    <div class="player-container mb-3">
                        <video id="video-player" controls autoplay playsinline></video>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <div id="current-channel-title" class="fw-bold text-info fs-5">اختر قناة للبدء بالتشغيل</div>
                        <div id="epg-info" class="text-white-50 small">دليل البرامج: غير متوفر</div>
                    </div>
                </div>
            </div>

            <!-- قائمة القنوات، الأقسام، المفضلة، والأخيرة -->
            <div class="col-lg-4">
                <div class="card card-custom p-3 h-100 shadow-sm">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mb-0 text-white"><i class="fa-solid fa-list me-2 text-info"></i> القنوات والمجموعات</h5>
                        <span id="channels-count" class="badge bg-secondary text-white">0 قناة</span>
                    </div>

                    <ul class="nav nav-pills nav-fill mb-2 bg-dark p-1 rounded" style="font-size: 0.85rem;">
                        <li class="nav-item"><button class="nav-link active text-white py-1" id="tab-all" onclick="switchView('all')">الكل</button></li>
                        <li class="nav-item"><button class="nav-link text-white py-1" id="tab-fav" onclick="switchView('fav')">المفضلة</button></li>
                        <li class="nav-item"><button class="nav-link text-white py-1" id="tab-recent" onclick="switchView('recent')">الأخيرة</button></li>
                    </ul>

                    <div class="mb-2" id="category-filter-container">
                        <select id="category-select" class="form-select form-select-sm">
                            <option value="all">جميع الأقسام</option>
                        </select>
                    </div>

                    <div class="mb-2">
                        <input type="text" id="search-channels" class="form-control form-control-sm" placeholder="ابحث عن قناة...">
                    </div>

                    <div class="channels-sidebar" id="channels-list">
                        <div class="text-center text-white-50 py-5">
                            <i class="fa-solid fa-folder-open fa-3x mb-2"></i>
                            <p>قم بتحميل قائمة IPTV للبدء</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
          <p class="mb-0 small">
                <a href="https://github.com/Free-TV/IPTV/tree/master/playlists" target="_blank" class="text-info text-decoration-none fw-bold">قوائم تشغيل قنوات مجانية </a>
            </p>
    </div>

    <!-- التذييل -->
    <footer class="py-3 mt-auto text-center text-white-50">
        <div class="container">
            <p class="mb-0 small">
                جميع الحقوق محفوظة &copy; 2026 | تصميم وتطوير 
                <a href="https://www.patreon.com/haythamzeidan" target="_blank" class="text-info text-decoration-none fw-bold">Haytham Zeidan</a>
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script src="script.js"></script>
        
   
</body>
</html>
